services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      # Postgres & Redis are Coolify-managed services. Point these at the
      # connection strings Coolify gives you (use the internal/service hostname
      # so traffic stays on Coolify's private network).
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot schema migration against the Coolify-managed Postgres.
  # Uses DATABASE_URL directly so it works with any external host/credentials.
  migrate:
    image: postgres:18-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ../backend/migrations:/migrations:ro
    entrypoint: ["sh", "-c", "psql \"$$DATABASE_URL\" -f /migrations/000001_init.sql"]
    restart: "no"
